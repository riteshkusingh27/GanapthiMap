<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GanapathiMap — Bengaluru's Ganesh Festival, Mapped.</title>
    <meta name="description" content="Discover Ganesh pandals across Bengaluru on an interactive map. View photos, Aarti timings, Prasad seva, eco-friendly pandals, and get directions." />
    
    <!-- Google Fonts: Outfit (Sans UI) & Playfair Display (Royal Festival Heading) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
              serif: ['"Playfair Display"', 'serif'],
            },
            colors: {
              festival: {
                50: '#fffbeb',
                100: '#fef3c7',
                200: '#fde68a',
                300: '#fcd34d',
                400: '#fbbf24',
                500: '#f59e0b',
                600: '#d97706',
                700: '#b45309',
                800: '#92400e',
                900: '#78350f',
                950: '#451a03',
              },
              deepMaroon: '#4C0519',
              royalGold: '#D97706',
              darkCanvas: '#0F172A',
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-900 font-sans antialiased overflow-hidden selection:bg-amber-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
